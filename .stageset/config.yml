# StageSet configuration.
# Workspace paths are resolved from workspace.root.
# Tracking and evidence paths are resolved from the repository root.
version: 2
timezone: Asia/Kolkata

workspace:
  root: "."
  code_dir: "Code"
  ideas_dir: "Ideas"
  skeletons_dir: "Skeletons"

tracking:
  sessions_dir: ".stageset/sessions"
  sessions_tracker: ".stageset/sessions-tracker.md"
  event_id_format: "YYYYMMDD-HHMMSS-TYPE"
  pending_time_source: "git-commit-time"

runs:
  reports_dir: ".stageset/runs"
  escalation_dir: ".stageset/escalations"
  facts_file: ".stageset/facts.md"
  digest_file: ".stageset/DIGEST.md"
  max_attempts_per_check: 3

skeletons:
  ready_statuses:
    - READY
    - IN_PROGRESS
  revision_rule: "spec_revision > implemented_revision"
  metadata_prefix: "@stageset"
